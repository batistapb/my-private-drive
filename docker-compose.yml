services:
  api:
    build:
      context: .
      dockerfile: MyPrivateDrive.Api/Dockerfile
    environment:
      - ConnectionStrings__Default=Host=db;Database=myprivatedrive;Username=postgres;Password=postgres
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in a .env file (see .env.example)}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=myprivatedrive
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  nginx:
    build:
      context: ./myprivatedrive-web
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata:
  storage_data:
